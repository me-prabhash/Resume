<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Banner - Prabhash Thakur</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .banner {
            width: 1584px;
            height: 396px;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        /* City Background */
        .background {
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(180deg, 
                    rgba(15, 25, 45, 0.85) 0%, 
                    rgba(20, 35, 60, 0.75) 50%,
                    rgba(10, 20, 40, 0.9) 100%
                ),
                linear-gradient(90deg,
                    rgba(0,0,0,0.3) 0%,
                    transparent 30%,
                    transparent 70%,
                    rgba(0,0,0,0.3) 100%
                );
            background-color: #0a1628;
        }

        /* City Silhouette */
        .city-silhouette {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 280px;
            background: 
                linear-gradient(to bottom, transparent 60%, rgba(20,40,70,0.4) 60%) 0 0 / 80px 100%,
                linear-gradient(to bottom, transparent 40%, rgba(25,45,75,0.3) 40%) 70px 0 / 60px 100%,
                linear-gradient(to bottom, transparent 55%, rgba(20,40,70,0.35) 55%) 120px 0 / 45px 100%,
                linear-gradient(to bottom, transparent 35%, rgba(30,50,80,0.3) 35%) 160px 0 / 70px 100%,
                linear-gradient(to bottom, transparent 50%, rgba(20,40,70,0.4) 50%) 220px 0 / 55px 100%,
                linear-gradient(to bottom, transparent 65%, rgba(25,45,75,0.35) 65%) 270px 0 / 40px 100%,
                linear-gradient(to bottom, transparent 45%, rgba(20,40,70,0.3) 45%) 305px 0 / 65px 100%,
                linear-gradient(to bottom, transparent 30%, rgba(30,55,85,0.35) 30%) 360px 0 / 50px 100%,
                linear-gradient(to bottom, transparent 55%, rgba(20,40,70,0.4) 55%) 400px 0 / 75px 100%,
                linear-gradient(to bottom, transparent 42%, rgba(25,50,80,0.3) 42%) 465px 0 / 55px 100%,
                linear-gradient(to bottom, transparent 60%, rgba(20,40,70,0.35) 60%) 510px 0 / 45px 100%,
                linear-gradient(to bottom, transparent 38%, rgba(30,55,85,0.3) 38%) 545px 0 / 70px 100%,
                linear-gradient(to bottom, transparent 52%, rgba(20,40,70,0.4) 52%) 605px 0 / 60px 100%,
                linear-gradient(to bottom, transparent 48%, rgba(25,45,75,0.35) 48%) 655px 0 / 50px 100%,
                linear-gradient(to bottom, transparent 58%, rgba(20,40,70,0.3) 58%) 695px 0 / 65px 100%;
            background-repeat: no-repeat;
        }

        /* Glowing Dots (City Lights) */
        .city-lights {
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            height: 200px;
            background-image: 
                radial-gradient(1px 1px at 50px 120px, rgba(255,200,100,0.8), transparent),
                radial-gradient(1px 1px at 85px 140px, rgba(255,220,150,0.6), transparent),
                radial-gradient(1px 1px at 120px 100px, rgba(200,220,255,0.7), transparent),
                radial-gradient(1px 1px at 180px 130px, rgba(255,200,100,0.5), transparent),
                radial-gradient(1px 1px at 220px 90px, rgba(255,220,150,0.8), transparent),
                radial-gradient(1px 1px at 280px 150px, rgba(200,220,255,0.6), transparent),
                radial-gradient(1px 1px at 350px 110px, rgba(255,200,100,0.7), transparent),
                radial-gradient(1px 1px at 420px 135px, rgba(255,220,150,0.5), transparent),
                radial-gradient(1px 1px at 500px 95px, rgba(200,220,255,0.8), transparent),
                radial-gradient(1px 1px at 580px 125px, rgba(255,200,100,0.6), transparent),
                radial-gradient(1px 1px at 650px 145px, rgba(255,220,150,0.7), transparent),
                radial-gradient(1px 1px at 720px 105px, rgba(200,220,255,0.5), transparent),
                radial-gradient(2px 2px at 800px 80px, rgba(255,150,50,0.9), transparent),
                radial-gradient(1px 1px at 880px 130px, rgba(255,200,100,0.6), transparent),
                radial-gradient(1px 1px at 950px 100px, rgba(255,220,150,0.8), transparent),
                radial-gradient(1px 1px at 1020px 140px, rgba(200,220,255,0.7), transparent),
                radial-gradient(1px 1px at 1100px 115px, rgba(255,200,100,0.5), transparent),
                radial-gradient(1px 1px at 1180px 90px, rgba(255,220,150,0.6), transparent),
                radial-gradient(1px 1px at 1250px 135px, rgba(200,220,255,0.8), transparent),
                radial-gradient(1px 1px at 1320px 105px, rgba(255,200,100,0.7), transparent),
                radial-gradient(1px 1px at 1400px 125px, rgba(255,220,150,0.5), transparent),
                radial-gradient(1px 1px at 1480px 95px, rgba(200,220,255,0.6), transparent),
                radial-gradient(1px 1px at 1550px 145px, rgba(255,200,100,0.8), transparent);
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            padding: 25px 50px;
        }

        /* Left Section - Empty space for profile pic */
        .left-section {
            width: 300px;
            flex-shrink: 0;
        }

        /* Right Section - Contact and Certifications */
        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            text-align: right;
        }

        /* Contact Info */
        .contact-info {
            text-align: right;
        }

        .email-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 6px;
        }

        .email-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #29b5e8 0%, #1a8cba 100%);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .email-icon svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .email-text {
            font-family: 'Open Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .linkedin-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .linkedin-icon {
            width: 28px;
            height: 28px;
            background: #0077b5;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .linkedin-icon svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .linkedin-text {
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        /* Name Container */
        .name-container {
            text-align: right;
        }

        .name {
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 6px;
            line-height: 1;
        }

        .title {
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #29b5e8;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Certifications */
        .certifications {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        .cert-badge {
            width: 205px;
            height: 205px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            padding: 10px;
        }

        .cert-badge:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(41, 181, 232, 0.4);
        }

        .cert-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Instructions */
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            text-align: center;
        }

        .instructions strong {
            color: #29b5e8;
        }
    </style>
</head>
<body>
    <div class="banner">
        <!-- Background -->
        <div class="background"></div>
        <div class="city-silhouette"></div>
        <div class="city-lights"></div>

        <!-- Content -->
        <div class="content">
            <!-- Left Section - Space for profile pic -->
            <div class="left-section"></div>

            <!-- Right Section - Contact and Certifications -->
            <div class="right-section">
                <!-- Contact Info -->
                <div class="contact-info">
                    <div class="email-row">
                        <div class="email-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                            </svg>
                        </div>
                        <span class="email-text">thakurprabhash80@gmail.com</span>
                    </div>
                    <div class="linkedin-row">
                        <div class="linkedin-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
                            </svg>
                        </div>
                        <span class="linkedin-text">@imprabhash</span>
                    </div>
                </div>

                <!-- Certifications -->
                <div class="certifications">
                    <div class="cert-badge">
                        <img src="certification/snowpro-genai.png" alt="SnowPro Specialty: Gen AI">
                    </div>
                    <div class="cert-badge">
                        <img src="certification/18a2a71f-2b09-4889-a671-9d3b98335203.png" alt="SnowPro Advanced Architect">
                    </div>
                    <div class="cert-badge">
                        <img src="certification/abd422e6-dc3a-42b5-a1db-6dd47bc722c6.png" alt="dbt Developer">
                    </div>
                    <div class="cert-badge">
                        <img src="certification/132cace9-1fbb-4515-9143-b0fadea70bbe.png" alt="SnowPro Advanced Data Engineer">
                    </div>
                    <div class="cert-badge">
                        <img src="certification/43f88c4e-b3be-4acb-8c06-7be8fe4a2007.png" alt="SnowPro Core">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="instructions">
        <strong>To save as image:</strong> Open in browser, then use screenshot tool or press Ctrl+Shift+P in DevTools → "Capture node screenshot"
    </div>
</body>
</html>
